# ==============================================================================
# ANTIGRAVITY AESTHETIC HYPRLOCK
# Minimalist, clean, atmospheric aesthetic with deep glassmorphism
# Dynamically synced to active workstation theme
# ==============================================================================

# Dynamic theme colors generated by Antigravity Theme Engine
source = ~/.config/hypr/hyprlock-colors.conf

$font = Google Sans Regular
$fontMono = Google Sans Regular

general {
    immediate_render = true
    hide_cursor = false
}

# ------------------------------------------------------------------------------
# ATMOSPHERIC BLURRED BACKGROUND (Obeying active desktop theme & wallpaper)
# ------------------------------------------------------------------------------
background {
    monitor =
    path = $lockWallpaper
    color = $bgBase
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.90
    brightness = 0.65
    vibrancy = 0.35
    vibrancy_darkness = 0.25
}

# ------------------------------------------------------------------------------
# ELEGANT TOP STATUS
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:10000] echo "✦ $(date +'%Z') // $(hostname) • $themeName"
    color = $textMuted
    font_size = 11
    font_family = $fontMono
    position = 0, -38
    halign = center
    valign = top
}

# ------------------------------------------------------------------------------
# CLEAN HERO DIGITAL CLOCK
# ------------------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $textPrimary
    font_size = 92
    font_family = $font
    position = 0, -100
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------------
# DATE & DAY SUB-HERO (Dynamic theme accent)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $accentActive
    font_size = 15
    font_family = $font
    position = 0, -230
    halign = center
    valign = top
}

# ------------------------------------------------------------------------------
# CIRCULAR PROFILE AVATAR (Halo obeying theme accent)
# ------------------------------------------------------------------------------
image {
    monitor =
    path = /var/lib/AccountsService/icons/alvin
    size = 96
    rounding = -1
    border_size = 2
    border_color = $avatarBorder
    position = 0, 95
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ------------------------------------------------------------------------------
# NATURAL PERSONALIZED GREETING
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] H=$(date +%-H); if [ $H -lt 12 ]; then echo "Good morning, Alvin"; elif [ $H -lt 17 ]; then echo "Good afternoon, Alvin"; elif [ $H -lt 22 ]; then echo "Good evening, Alvin"; else echo "Welcome back, Alvin"; fi
    color = $textPrimary
    font_size = 19
    font_family = $font
    position = 0, 22
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Subtle prompt subtitle
label {
    monitor =
    text = Touch a key or enter password to unlock
    color = $textMuted
    font_size = 11
    font_family = $font
    position = 0, -6
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# MINIMALIST OBSIDIAN INPUT FIELD (Dynamic theme outer border & check color)
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    rounding = 23
    inner_color = $bgCard
    outer_color = $borderOuter
    font_color = $textPrimary
    font_family = $font

    fade_on_empty = false
    placeholder_text = <span foreground="$placeholderColor">Password...</span>
    hide_input = false

    check_color = $accentActive
    fail_color = $failColor
    fail_text = <span foreground="##F43F5E">Incorrect password ($ATTEMPTS)</span>

    position = 0, -68
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------------
# FOOTER TAGLINE (Dynamic theme accent)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = Vibe Coded Shell btw
    color = $accentActive
    font_size = 11
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}

# ------------------------------------------------------------------------------
# MINIMAL POWER & SYSTEM STATUS
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:10000] B=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); S=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -1); [ -n "$B" ] && echo "$B% • $S" || echo "Plugged In"
    color = $textMuted
    font_size = 10
    font_family = $fontMono
    position = 0, 24
    halign = center
    valign = bottom
}
