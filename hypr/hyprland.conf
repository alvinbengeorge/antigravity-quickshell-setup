# ==============================================================================
# Hyprland Configuration for Fedora 44 with Quickshell (end4-pC)
# ==============================================================================

# Monitor configuration
# Left (Main External Monitor - Samsung 27" @ 100Hz):
monitor = HDMI-A-1, 1920x1080@100, 0x0, 1

# Middle / Right (Integrated Laptop Display @ 60Hz):
monitor = eDP-1, 1920x1080@60.06, 1920x0, 1

# Fallback for any other newly connected display:
monitor = , preferred, auto, 1

# Workspace assignments to monitors
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1, default:true
workspace = 7, monitor:eDP-1, layout:scrolling
workspace = 8, monitor:eDP-1, layout:scrolling
workspace = 9, monitor:eDP-1

# Environment Variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV,/home/alvin/.local/state/quickshell/venv
env = qsConfig,antigravity

# ------------------------------------------------------------------------------
# Autostart
# ------------------------------------------------------------------------------
# Lock screen on initial boot
exec-once = hyprlock

# Launch Quickshell end4-pC automatically
exec-once = ~/.config/hypr/scripts/launch-shell.sh

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# XDG Portal for Wayland screen sharing / file dialogs
# Note: Hyprland doesn't activate graphical-session.target, so portals are started directly
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = ~/.config/hypr/scripts/start-portals.sh

# Audio effects daemon (EasyEffects) for quickshell equalizer
exec-once = easyeffects --gapplication-service

# ------------------------------------------------------------------------------
# Input Configuration
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ------------------------------------------------------------------------------
# Gestures
# ------------------------------------------------------------------------------
gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_direction_lock = true
}

# ------------------------------------------------------------------------------
# General & Window Styling
# ------------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ffaa00ee) rgba(ffc533ee) 45deg
    col.inactive_border = rgba(171f2eaa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.28

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 28
        render_power = 4
        color = rgba(ffaa0044)
        color_inactive = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 6, default
    animation = border, 1, 5, easeOutQuint
    animation = windows, 1, 4.5, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3.5, easeOutQuint, popin 80%
    animation = fadeIn, 1, 3.5, easeOutQuint
    animation = fadeOut, 1, 3.5, easeOutQuint
    animation = fadeDim, 1, 4, easeOutQuint
    animation = fadeShadow, 1, 4, easeOutQuint
    animation = workspaces, 1, 4, easeOutQuint, slide
    animation = specialWorkspace, 1, 4, easeOutQuint, slidevert
}


scrolling {
    column_width = 0.5
    direction = right
    focus_fit_method = 1
    follow_focus = 1
    wrap_focus = true
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = false
    disable_hyprland_guiutils_check = true
    session_lock_xray = true
}

# ------------------------------------------------------------------------------
# Window Rules
# ------------------------------------------------------------------------------
# Universal Dropdown Terminal (Quake-style scratchpad)
windowrulev2 = float, class:^(kitty-scratchpad)$
windowrulev2 = size 75% 60%, class:^(kitty-scratchpad)$
windowrulev2 = move 12.5% 52, class:^(kitty-scratchpad)$
windowrulev2 = workspace special:scratchpad, class:^(kitty-scratchpad)$
windowrulev2 = rounding 16, class:^(kitty-scratchpad)$

# Quickshell Compositor Blur Rules (Panels, Dialogs & Modals only; TopBar & OSD remain pure transparent)
layerrule = blur, quickshell:(session|antigravity:hud|clipboard|wallpapertheme|docker|runner|windowswitcher|whatsapp|systemmonitor|controlcenter|omnibar|notifications)
layerrule = ignorealpha 0.2, quickshell:(session|antigravity:hud|clipboard|wallpapertheme|docker|runner|windowswitcher|whatsapp|systemmonitor|controlcenter|omnibar|notifications)

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Applications
bind = $mainMod, Q, exec, kitty
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, google-chrome || brave-browser || chromium
bind = CTRL SHIFT, Escape, exec, btop
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/scratchpad.sh

# App Launcher & Search (Multiple triggers supported)
bindr = $mainMod, SUPER_L, exec, qs -c antigravity ipc call search toggle
bind  = $mainMod, Space, exec, qs -c antigravity ipc call search toggle
bind  = $mainMod, D, exec, qs -c antigravity ipc call docker toggle
bind  = $mainMod, R, exec, qs -c antigravity ipc call runner toggle

# Antigravity & Quickshell UI Overlays
bind  = $mainMod, Escape, exec, qs -c antigravity ipc call session toggle
bind  = $mainMod, Tab, exec, qs -c antigravity ipc call windowSwitcher toggle
bind  = $mainMod, slash, exec, qs -c antigravity ipc call search toggle
bind  = $mainMod, K, exec, qs -c antigravity ipc call omnibar toggle
bind  = $mainMod, A, exec, qs -c antigravity ipc call antigravity toggle
bind  = $mainMod, N, exec, qs -c antigravity ipc call antigravity toggle
bind  = $mainMod, X, exec, qs -c antigravity ipc call session toggle
bind  = $mainMod, V, exec, qs -c antigravity ipc call clipboard toggle
bind  = $mainMod, W, exec, qs -c antigravity ipc call wallpaperTheme toggle
bind  = $mainMod, Period, exec, qs -c antigravity ipc call search toggle
bind  = $mainMod, I, exec, qs -c antigravity ipc call antigravity toggle
bind  = $mainMod, L, exec, hyprlock
bind  = $mainMod SHIFT, L, exec, qs -c antigravity ipc call liteMode toggle
bind  = $mainMod SHIFT, M, exec, qs -c antigravity ipc call systemMonitor toggle

# Window actions
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/launch-shell.sh
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Scrolling Layout Controls (PaperWM Ribbon - Workspaces 7 & 8)
bind = $mainMod, bracketright, layoutmsg, move +col
bind = $mainMod, bracketleft,  layoutmsg, move -col
bind = $mainMod SHIFT, bracketright, layoutmsg, swapcol r
bind = $mainMod SHIFT, bracketleft,  layoutmsg, swapcol l
bind = $mainMod, equal, layoutmsg, colresize +conf
bind = $mainMod, minus, layoutmsg, colresize -conf
bind = $mainMod, O, layoutmsg, promote

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Switching (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Media and Hardware Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, qs -c antigravity ipc call brightness up
bindel = , XF86MonBrightnessDown, exec, qs -c antigravity ipc call brightness down

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# ------------------------------------------------------------------------------
# GTK Settings
# ------------------------------------------------------------------------------

# Force GTK settings on startup
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Environment variable for stubborn apps
env = GTK_THEME,Adwaita-dark

# Screenshot
bind = $mainMod_SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , PRINT, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +'%Y-%m-%d-%H%M%S').png
bind = $mainMod, PRINT, exec, grim ~/Pictures/screenshot-$(date +'%Y-%m-%d-%H%M%S').png
