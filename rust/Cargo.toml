[package]
name = "antigravity_tools"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[[bin]]
name = "fast_system_stats"
path = "src/bin/fast_system_stats.rs"

[[bin]]
name = "system_monitor"
path = "src/bin/system_monitor.rs"

[[bin]]
name = "cliphist_helper"
path = "src/bin/cliphist_helper.rs"

[[bin]]
name = "extract_media_color"
path = "src/bin/extract_media_color.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
