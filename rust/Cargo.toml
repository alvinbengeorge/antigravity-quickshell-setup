[package]
name = "antigravity_tools"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
rustfft = "6.4.1"
realfft = "3.5.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[lib]
name = "antigravity_tools"
path = "src/lib.rs"

[[bin]]
name = "agy-tools"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
